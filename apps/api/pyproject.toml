[project]
name = "nestora-api"
version = "0.1.0"
description = "Nestora FastAPI backend"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.139.2",
  "uvicorn[standard]==0.35.0",
  "sqlalchemy==2.0.50",
  "psycopg[binary]==3.2.9",
  "alembic==1.18.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.10.1",
  "email-validator==2.2.0",
  "python-multipart==0.0.31",
  "httpx==0.28.1",
  "redis==6.4.0",
  "boto3==1.40.11",
  "pgvector==0.4.1",
  "prometheus-client==0.22.1",
  "sentry-sdk[fastapi]==2.35.0",
  "reportlab==4.4.3",
  "qrcode[pil]==8.2",
  "pypdf==6.14.2",
  "Pillow==12.3.0",
  "cryptography==48.0.1",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-cov==6.2.1",
]

[tool.uv]
package = false
