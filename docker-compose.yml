services:
  postgres:
    build: ./infra/postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nestora}
      POSTGRES_USER: ${POSTGRES_USER:-nestora}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nestora} -d ${POSTGRES_DB:-nestora}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports: ["5432:5432"]

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports: ["6379:6379"]

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
    volumes: ["minio_data:/data"]
    ports: ["9000:9000", "9001:9001"]

  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c"]
    command: >-
      until mc alias set local http://minio:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}"; do sleep 2; done &&
      mc mb --ignore-existing local/$${S3_BUCKET:-nestora} &&
      mc anonymous set download local/$${S3_BUCKET:-nestora}
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Set S3_ACCESS_KEY in .env}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Set S3_SECRET_KEY in .env}
      S3_BUCKET: ${S3_BUCKET:-nestora}

  migrate:
    build: ./apps/api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nestora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nestora}
    command: alembic upgrade head
    depends_on:
      postgres: { condition: service_healthy }

  api:
    build: ./apps/api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nestora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nestora}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_URL: http://localhost:9000
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      minio-init: { condition: service_completed_successfully }
    ports: ["8000:8000"]

  worker:
    build: ./apps/api
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-nestora}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nestora}
      REDIS_URL: redis://redis:6379/0
      STORAGE_BACKEND: s3
      S3_ENDPOINT: http://minio:9000
    command: python -m app.worker
    depends_on:
      migrate: { condition: service_completed_successfully }
      redis: { condition: service_healthy }

  web:
    build:
      context: ./apps/web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
    env_file: [.env]
    environment:
      API_INTERNAL_URL: http://api:8000/api/v1
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      NEXT_PUBLIC_API_ORIGIN: http://localhost:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
    depends_on:
      api: { condition: service_healthy }
    ports: ["3000:3000"]

volumes:
  postgres_data:
  redis_data:
  minio_data:
