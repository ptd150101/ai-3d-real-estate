name: CI
on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: pip install -r requirements.txt
      - run: python -m compileall -q app
      - run: pytest --cov=app --cov-report=term-missing
      - run: DATABASE_URL=sqlite:///./migration-test.db SEED_ADMIN_PASSWORD=test-admin-password SEED_AGENT_PASSWORD=test-agent-password SEED_BUYER_PASSWORD=test-buyer-password alembic upgrade head
      - run: python ../../scripts/generate_openapi.py
      - uses: actions/upload-artifact@v4
        with:
          name: openapi
          path: packages/contracts/openapi.json

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install
      - run: npm --workspace apps/web run typecheck
      - run: npm --workspace apps/web run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: |
          echo 'SECRET_KEY=ci-test-secret-key-with-more-than-thirty-two-chars' >> .env
          echo 'POSTGRES_PASSWORD=ci-postgres-password' >> .env
          echo 'S3_ACCESS_KEY=ci-minio-user' >> .env
          echo 'S3_SECRET_KEY=ci-minio-password' >> .env
      - run: docker compose config
