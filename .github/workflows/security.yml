name: Security

on:
  pull_request:
  push:
    branches: [main, "agent/**"]
  schedule:
    - cron: "17 2 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v3

  python-security:
    name: Python dependency and SAST scan
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/api } }
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "0.11.32"
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: apps/api/pyproject.toml
      - run: uv sync
      - run: uv run --with pip-audit pip-audit --strict
      - run: uv run --with bandit bandit -q -r app -x tests -ll
      - name: Reject dynamic metadata migrations
        run: |
          if grep -R "metadata.create_all\|metadata.drop_all" alembic/versions; then
            echo "Historical migrations must use explicit table operations" >&2
            exit 1
          fi

  javascript-security:
    name: JavaScript dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix apps/web --ignore-scripts
      - run: npm audit --prefix apps/web --audit-level=high
      - run: npm install --prefix apps/mobile --ignore-scripts
      - name: Audit mobile dependencies
        run: |
          npm audit --prefix apps/mobile --json > apps/mobile/npm-audit.json || true
          node scripts/check-mobile-audit.mjs apps/mobile/npm-audit.json

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  filesystem:
    name: Filesystem vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --prefix apps/web --ignore-scripts
      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table
