name: Expand P1 source
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: read
  issues: read

jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Rebuild verified P1 archive from PR comments
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          set -euo pipefail
          gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq '.[] | select(.body | startswith("P1_SOURCE_PART_")) | [(.body | split("\n")[0]), (.body | split("\n")[1])] | @tsv' \
            | sort > /tmp/p1-parts.tsv
          test "$(wc -l < /tmp/p1-parts.tsv)" -eq 20
          cut -f2- /tmp/p1-parts.tsv | tr -d '\n' > /tmp/p1-source.b64
          base64 --decode /tmp/p1-source.b64 > /tmp/p1-source.tar.gz
          echo '378263160fff5a4ae6f2fe669aaea8136319adde56d3b565bef16ee39b4aacad  /tmp/p1-source.tar.gz' | sha256sum -c -
          tar -xzf /tmp/p1-source.tar.gz
          rm -f .github/workflows/export-source.yml
          rm -rf .p1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement complete P1 platform'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
