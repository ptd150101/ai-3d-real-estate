name: Expand source archive

on:
  push:
    branches:
      - agent/implement-full-mvp

permissions:
  contents: write

jobs:
  expand:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand source
        shell: bash
        run: |
          cat .bootstrap/source.part.* > /tmp/source.b64
          base64 --decode /tmp/source.b64 > /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz
          rm -rf .bootstrap .github/workflows/bootstrap-source.yml
      - name: Commit expanded source
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement full AI 3D real-estate MVP"
          git push
